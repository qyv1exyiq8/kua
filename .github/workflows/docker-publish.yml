name: Sync Docker image to Docker Hub

# 定时把最新 Release 的 linux/amd64 镜像同步到 Docker Hub。
# 只推 amd64：Release 里另有 arm64 镜像包，ARM 设备继续走 Release 下载 + docker load。
# 保留策略：Docker Hub 上只保留最新 10 个版本标签（latest 不计入），其余版本标签在每次同步后自动删除。

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17），避开整点高峰
    - cron: "17 3 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 指定同步的版本号，留空则取最新 Release（例：v0.1.369）
        required: false
        type: string
      force:
        description: 目标版本已存在时仍强制重新推送
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-hub-sync
  cancel-in-progress: false

# 非敏感配置走 Actions Variables，敏感令牌走 Secrets。
#   Variables（可选）：DOCKERHUB_IMAGE、DOCKERHUB_USERNAME、DOCKER_REPO
#   Secrets（必需）：DOCKERHUB_TOKEN
env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'kkxdv/open-box' }}
  REPO: ${{ vars.DOCKER_REPO || 'liandu2024/Open-Box' }}

jobs:
  sync:
    name: 同步 amd64 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'kkxdv' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}

      - name: 解析目标版本
        id: target
        run: |
          set -euo pipefail
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ver=$(curl -fsSL -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/latest" | jq -r '.tag_name')
          fi
          ver="${ver#v}"
          if [ -z "$ver" ] || [ "$ver" = "null" ]; then
            echo "没有找到可用的 Release 版本" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "目标版本：$ver"

      - name: 检查是否需要同步
        id: check
        run: |
          set -euo pipefail
          ver="${{ steps.target.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "force 已开启，强制同步 $ver"
            exit 0
          fi
          if docker manifest inspect "${IMAGE}:${ver}" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${ver} 已存在，跳过同步"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 查找 Release 里的 amd64 镜像包
        id: asset
        run: |
          set -euo pipefail
          ver="${{ steps.target.outputs.version }}"
          name="open-box-docker-${ver}-linux-x64.tar.gz"
          url=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/v${ver}" \
            | jq -r --arg n "$name" '.assets[] | select(.name == $n) | .browser_download_url')
          if [ -z "$url" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Release v${ver} 不含 $name，跳过本次同步"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载并校验镜像包
        if: steps.check.outputs.needed == 'true' && steps.asset.outputs.found == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.target.outputs.version }}"
          asset="open-box-docker-${ver}-linux-x64.tar.gz"
          curl -fsSL --retry 3 -o "$asset" "${{ steps.asset.outputs.url }}"
          curl -fsSL --retry 3 -o "$asset.sha256" \
            "https://github.com/${REPO}/releases/download/v${ver}/${asset}.sha256"
          sha256sum -c "$asset.sha256"

      - name: 载入镜像并推送
        if: steps.check.outputs.needed == 'true' && steps.asset.outputs.found == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.target.outputs.version }}"
          asset="open-box-docker-${ver}-linux-x64.tar.gz"
          docker load -i "$asset"
          src=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^open-box:' | head -n 1)
          if [ -z "$src" ]; then
            echo "镜像载入后没有找到 open-box 标签" >&2
            exit 1
          fi
          if [ "$src" != "open-box:${ver}" ]; then
            echo "镜像标签 $src 与 Release 版本 $ver 不一致" >&2
            exit 1
          fi
          docker tag "$src" "${IMAGE}:${ver}"
          docker push "${IMAGE}:${ver}"
          docker tag "$src" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

      # 只保留最新 10 个版本标签（按推送时间倒序，latest 不计入），其余删除
      - name: 清理旧版本（只保留最新 10 个）
        run: |
          set -euo pipefail
          KEEP=10
          USERNAME="${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'kkxdv' }}"
          TOKEN="${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "缺少 DOCKERHUB_TOKEN，跳过清理" >&2
            exit 1
          fi

          # Docker Hub API 登录（PAT 可作为 password）
          JWT=$(curl -fsSL --retry 3 -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${USERNAME}\",\"password\":\"${TOKEN}\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r '.token')
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "Docker Hub 登录失败，跳过清理" >&2
            exit 1
          fi

          # 分页拉取全部标签及其更新时间
          all=$(mktemp)
          page=1
          while true; do
            curl -fsSL --retry 3 -H "Authorization: JWT ${JWT}" \
              "https://hub.docker.com/v2/repositories/${IMAGE}/tags/?page_size=100&page=${page}" \
              > /tmp/dh_tags_page.json
            jq -r '.results[] | [.name, .last_updated] | @tsv' /tmp/dh_tags_page.json >> "$all"
            next=$(jq -r '.next // empty' /tmp/dh_tags_page.json)
            if [ -z "$next" ]; then
              break
            fi
            page=$((page + 1))
          done

          # 按更新时间倒序，latest 不计入保留名额
          sorted=$(mktemp)
          sort -t$'\t' -k2,2r "$all" | awk -F'\t' '$1 != "latest"' > "$sorted"
          total=$(wc -l < "$sorted")
          echo "版本标签共 ${total} 个，保留最新 ${KEEP} 个，latest 始终保留"

          # 保留名单之外的全部删除
          tail -n "+$((KEEP + 1))" "$sorted" | cut -f1 > /tmp/dh_tags_del.txt
          deleted=0
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "删除旧版本标签：${tag}"
            if curl -fsSL --retry 3 -X DELETE \
              -H "Authorization: JWT ${JWT}" \
              "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${tag}/"; then
              deleted=$((deleted + 1))
            else
              echo "删除 ${tag} 失败（可能已被删除），继续" >&2
            fi
          done < /tmp/dh_tags_del.txt

          echo "清理完成：已删除 ${deleted} 个旧版本标签"
          {
            echo ""
            echo "- 保留策略：最新 ${KEEP} 个版本 + latest"
            echo "- 本次清理删除：${deleted} 个旧版本标签"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 输出同步结果
        if: steps.check.outputs.needed == 'true' && steps.asset.outputs.found == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.target.outputs.version }}"
          digest=$(docker manifest inspect --verbose "${IMAGE}:${ver}" \
            | jq -r '.[].Descriptor.digest' | head -n 1)
          {
            echo "### Docker Hub 同步完成"
            echo ""
            echo "- 镜像：\`${IMAGE}:${ver}\`"
            echo "- latest：\`${IMAGE}:latest\`"
            echo "- 架构：linux/amd64"
            echo "- digest：\`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "同步完成：${IMAGE}:${ver} (linux/amd64) ${digest}"
